# nginx панели хостинга → ilpacco на 127.0.0.1:8080. Вставить в конфиг сайта ilpacco.ru (server с listen 443 ssl).
location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffer_size 128k;           # большие заголовки Keycloak
    proxy_buffers 4 256k;
    client_max_body_size 70m;         # фото и видео товаров (до 60 МБ), фото с хаба и к спорам
    proxy_read_timeout 120s;
}
