name: ilpacco

on:
  push:
    branches: ["**"]
    # Тег ilpacco-vX.Y.Z — релиз: образы с номером версии и архив исходников на странице Releases.
    tags: ["ilpacco-v*"]
    paths:
      - "pacco/**"
      - ".github/workflows/pacco.yml"
  pull_request:
    paths:
      - "pacco/**"
      - ".github/workflows/pacco.yml"
  workflow_dispatch:

concurrency:
  group: pacco-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Бэкенд · сборка и тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pacco/backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pacco
          POSTGRES_USER: pacco
          POSTGRES_PASSWORD: pacco
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pacco -d pacco" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Сборка и тесты
        run: |
          set -o pipefail
          mvn -B -ntp verify 2>&1 | tee build.log
      - name: Ошибки сборки — в аннотации
        if: failure()
        run: |
          grep -E '^\[ERROR\]|Caused by|Exception:|expected|but was' build.log \
            | grep -vE '^\[ERROR\] *$|^\[ERROR\] (To see|Re-run|For more|-> \[Help|After correcting)' \
            | head -45 | while IFS= read -r l; do l="${l//'%'/%25}"; echo "::error::${l:0:900}"; done
      - name: Отчёты тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            pacco/backend/target/surefire-reports
            pacco/backend/target/spring-modulith-docs
          if-no-files-found: ignore

  web:
    name: Витрина · сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pacco/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: package-lock.json для фиксации версий
        uses: actions/upload-artifact@v4
        with:
          name: web-package-lock
          path: pacco/web/package-lock.json

  smoke:
    name: Деплой в Docker Compose и сквозная проверка
    needs: [backend, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: pacco
    env:
      PUBLIC_URL: http://localhost
      SITE_ADDRESS: ":80"
      REGISTRY: local
      TAG: ci
    steps:
      - uses: actions/checkout@v5
      - name: Сборка и запуск всего стека
        run: docker compose up -d --build
      - name: Сквозная проверка через Caddy
        run: BASE=http://localhost ADMIN_PASSWORD=change-me-now STATE_FILE=/tmp/ilpacco-orders infra/smoke.sh
      - name: Браузер — вход через Keycloak в админку и кабинет продавца
        run: |
          mkdir -p /tmp/e2e e2e-screens
          npm install --prefix /tmp/e2e --no-audit --no-fund playwright@1
          /tmp/e2e/node_modules/.bin/playwright install --with-deps chromium
          cp infra/e2e/*.mjs /tmp/e2e/
          BASE=http://localhost PASSWORD=change-me-now OUT=$PWD/e2e-screens ORDERS_FILE=/tmp/ilpacco-orders node /tmp/e2e/cabinets.mjs
      - name: Браузер — витрина на компьютере и телефоне
        run: BASE=http://localhost OUT=$PWD/e2e-screens ORDERS_FILE=/tmp/ilpacco-orders node /tmp/e2e/storefront.mjs
      - name: Скриншоты — в ветку ci-screenshots
        if: always() && github.event_name == 'push'
        run: |
          [ -d e2e-screens ] && [ "$(ls -A e2e-screens)" ] || exit 0
          cd e2e-screens
          git init -q -b ci-screenshots
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "Скриншоты ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-screenshots
      - name: Скриншоты кабинетов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cabinets-screens
          path: pacco/e2e-screens
          if-no-files-found: ignore
      - name: Логи сервисов
        if: failure()
        run: docker compose logs --no-color --tail 300
      - name: Остановка
        if: always()
        run: docker compose down -v

  images:
    name: Образы в GitHub Container Registry
    needs: smoke
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/ilpacco-v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Имя реестра в нижнем регистре
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: pacco/backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/pacco-backend:latest
            ${{ env.REGISTRY }}/pacco-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/pacco-backend:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
      - uses: docker/build-push-action@v6
        with:
          context: pacco/web
          push: true
          build-args: BACKEND_URL=http://backend:8080
          tags: |
            ${{ env.REGISTRY }}/pacco-web:latest
            ${{ env.REGISTRY }}/pacco-web:${{ github.sha }}
            ${{ env.REGISTRY }}/pacco-web:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}

  release:
    name: Релиз — архив и страница Releases
    needs: images
    if: startsWith(github.ref, 'refs/tags/ilpacco-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Архив проекта
        run: |
          git archive --format=zip --prefix=ilpacco/ -o "${GITHUB_REF_NAME}.zip" HEAD pacco
          git archive --format=tar.gz --prefix=ilpacco/ -o "${GITHUB_REF_NAME}.tar.gz" HEAD pacco
      - name: Описание релиза
        run: |
          {
            echo "Образы: \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pacco-backend:${GITHUB_REF_NAME}\`, \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pacco-web:${GITHUB_REF_NAME}\`"
            echo
            echo "Запуск: распакуйте архив, \`cd ilpacco/pacco && cp .env.example .env\`, затем \`TAG=${GITHUB_REF_NAME} docker compose up -d --no-build\` или \`docker compose up -d --build\`."
            echo
            awk '/^## /{n++} n==1' pacco/CHANGELOG.md
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: ilpacco ${{ github.ref_name }}
          body_path: notes.md
          files: |
            ${{ github.ref_name }}.zip
            ${{ github.ref_name }}.tar.gz
